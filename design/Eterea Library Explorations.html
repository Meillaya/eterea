<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Eterea — Library Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #f0eee9; }
  /* Variation B uses Source Serif 4 in place of Charter */
  .var-b-root, .var-b-root * {
    font-family: "Source Serif 4", "Charter", "Iowan Old Style", Georgia, serif !important;
  }
  .var-b-root .smallcaps {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace !important;
  }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#0a0c14"/>
    <text x="50" y="62" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="38" fill="#ff9861">e</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="mock-data.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="variation-a.jsx"></script>
<script type="text/babel" src="variation-b.jsx"></script>
<script type="text/babel" src="variation-c.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accentA": "#ff9861",
    "accentB": "#a8421f",
    "accentC": "#ff9861",
    "density": "regular",
    "showFrame": true
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

    const W = 1280;
    const H = 820;

    return (
      <>
        <DesignCanvas>
          <DCSection
            id="library"
            title="Eterea — Library shell"
            subtitle="Three directions for the calm reading-room app, all driving the same Rust + Dioxus backend"
          >
            <DCArtboard id="a" label="A · Refined Calm" width={W} height={H}>
              <VariationA accent={t.accentA} density={t.density} />
            </DCArtboard>
            <DCArtboard id="b" label="B · Editorial Reading-Room" width={W} height={H}>
              <div className="var-b-root" style={{ width: "100%", height: "100%" }}>
                <VariationB accent={t.accentB} density={t.density} />
              </div>
            </DCArtboard>
            <DCArtboard id="c" label="C · Terminal Archive" width={W} height={H}>
              <VariationC accent={t.accentC} density={t.density} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel>
          <TweakSection label="Variation A — Refined Calm" />
          <TweakColor
            label="Accent"
            value={t.accentA}
            onChange={(v) => setTweak("accentA", v)}
          />

          <TweakSection label="Variation B — Editorial" />
          <TweakColor
            label="Accent"
            value={t.accentB}
            onChange={(v) => setTweak("accentB", v)}
          />

          <TweakSection label="Variation C — Terminal" />
          <TweakColor
            label="Accent"
            value={t.accentC}
            onChange={(v) => setTweak("accentC", v)}
          />

          <TweakSection label="All variations" />
          <TweakRadio
            label="Density"
            value={t.density}
            options={["compact", "regular", "comfy"]}
            onChange={(v) => setTweak("density", v)}
          />
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
