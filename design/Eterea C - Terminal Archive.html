<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Eterea — Terminal Archive (Variation C, expanded)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #11111b; }
  ::selection { background: rgba(245,194,231,0.35); }
  /* Hide scrollbars in tight TUI areas while keeping scroll */
  .c-thin-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .c-thin-scroll::-webkit-scrollbar-track { background: transparent; }
  .c-thin-scroll::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#1e1e2e"/>
    <text x="50" y="62" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="36" font-weight="700" fill="#f5c2e7">▮</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="mock-data.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="c-system.jsx"></script>
<script type="text/babel" src="c-chrome.jsx"></script>
<script type="text/babel" src="c-views.jsx"></script>
<script type="text/babel" src="c-screens.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "themeKey": "mocha",
    "fontKey": "jetbrains",
    "density": "regular",
    "weight": "regular",
    "accentKey": "pink",
    "view": "table",
    "focus": "library"
  }/*EDITMODE-END*/;

  const ACCENT_MAP = {
    pink:  (t) => t.accent,
    blue:  (t) => t.blue,
    green: (t) => t.green,
    peach: (t) => t.peach,
    mauve: (t) => t.mauve,
    yellow:(t) => t.yellow,
  };

  const PALETTE_ITEMS = [
    { id: "go-library", label: "Go to: Library",    sub: "tab",    icon: "▶", kbd: "1", screen: "library" },
    { id: "go-authors", label: "Go to: Authors",    sub: "tab",    icon: "▶", kbd: "2", screen: "authors" },
    { id: "go-topics",  label: "Go to: Topics",     sub: "tab",    icon: "▶", kbd: "3", screen: "topics" },
    { id: "go-search",  label: "Go to: Search",     sub: "tab",    icon: "/", kbd: "4", screen: "search" },
    { id: "go-import",  label: "Go to: Import",     sub: "tab",    icon: "⇣", kbd: "5", screen: "import" },
    { id: "go-settings",label: "Go to: Settings",   sub: "tab",    icon: "⚙", kbd: "6", screen: "settings" },
    { id: "go-detail",  label: "Open: Entry detail",sub: "screen", icon: "▤",          screen: "detail" },
    { id: "go-onboard", label: "Open: Onboarding",  sub: "screen", icon: "▤",          screen: "onboarding" },
    { id: "view-table", label: "View: Table",       sub: "library", icon: "≡",          view: "table",     screen: "library", keywords: "list rows" },
    { id: "view-tree",  label: "View: Tree by author", sub: "library", icon: "▾",      view: "tree",      screen: "library", keywords: "group authors" },
    { id: "view-dash",  label: "View: Dashboard",   sub: "library", icon: "▦",          view: "dashboard", screen: "library", keywords: "stats overview" },
    { id: "view-graph", label: "View: Tag graph",   sub: "library", icon: "◯",          view: "graph",     screen: "library", keywords: "network nodes" },
    { id: "view-cal",   label: "View: Calendar heatmap", sub: "library", icon: "▣",     view: "calendar",  screen: "library", keywords: "history time" },
    { id: "theme-mocha",label: "Theme: Mocha",      sub: "appearance", icon: "●",       theme: "mocha" },
    { id: "theme-macc", label: "Theme: Macchiato",  sub: "appearance", icon: "●",       theme: "macchiato" },
    { id: "theme-latte",label: "Theme: Latte",      sub: "appearance", icon: "○",       theme: "latte" },
    { id: "fav-toggle", label: "Toggle: Favorite",  sub: "action",     icon: "★", kbd: "f" },
    { id: "yank",       label: "Yank: Selected text", sub: "action",   icon: "✂", kbd: "y" },
    { id: "import-now", label: "Import: From X archive", sub: "action", icon: "⇣" },
  ];

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const theme = cTheme(t.themeKey);
    const font = cFont(t.fontKey);
    const accent = (ACCENT_MAP[t.accentKey] || ACCENT_MAP.pink)(theme);
    const weightStyle = t.weight === "bold" ? { fontWeight: 600 } : null;

    const [screen, setScreen] = React.useState(t.focus || "library");
    const [view, setView]     = React.useState(t.view || "table");
    const [selectedIdx, setSelectedIdx] = React.useState(0);
    const [multi, setMulti]   = React.useState(new Set());
    const [mode, setMode]     = React.useState("NORMAL");
    const [command, setCommand] = React.useState("");
    const [searchQuery, setSearchQuery] = React.useState("rust");
    const [palette, setPalette] = React.useState(false);
    const [paletteQ, setPaletteQ] = React.useState("");
    const [paletteSel, setPaletteSel] = React.useState(0);
    const [showHelp, setShowHelp] = React.useState(false);

    React.useEffect(() => { setScreen(t.focus); }, [t.focus]);
    React.useEffect(() => { setView(t.view);   }, [t.view]);

    const items = BOOKMARKS;

    // Click delegate for sidebar tabs (anchors with data-screen)
    const onTopBarClick = (e) => {
      const tab = e.target.closest("[data-screen]");
      if (tab) { e.preventDefault(); setScreen(tab.dataset.screen); }
    };

    // Key handler — only inside the artboard, scoped to focus
    const rootRef = React.useRef(null);
    React.useEffect(() => {
      const el = rootRef.current;
      if (!el) return;
      const onKey = (e) => {
        // Don't hijack typing in inputs
        if (e.target.matches("input, textarea")) return;
        if (mode === "COMMAND" || mode === "SEARCH") return;

        if (e.key === "?") { setShowHelp(true); return; }
        if (e.key === "Escape") { setShowHelp(false); setPalette(false); setMulti(new Set()); setMode("NORMAL"); return; }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "p") { e.preventDefault(); setPalette(true); setPaletteQ(""); return; }
        if (e.key === "/") { e.preventDefault(); setMode("SEARCH"); setCommand(""); return; }
        if (e.key === ":") { e.preventDefault(); setMode("COMMAND"); setCommand(""); return; }
        if (e.key === "j" || e.key === "ArrowDown") { setSelectedIdx(i => Math.min(items.length - 1, i + 1)); }
        if (e.key === "k" || e.key === "ArrowUp")   { setSelectedIdx(i => Math.max(0, i - 1)); }
        if (e.key === "g" && e.shiftKey)            { setSelectedIdx(items.length - 1); }
        if (e.key === "g" && !e.shiftKey)           { setSelectedIdx(0); }
        if (e.key === "o" || e.key === "Enter")     { setScreen("detail"); }
        if (e.key === " ") {
          e.preventDefault();
          setMulti(s => { const n = new Set(s); const id = items[selectedIdx]?.id; if (n.has(id)) n.delete(id); else n.add(id); return n; });
        }
        if (e.key === "v") { setMode(m => m === "VISUAL" ? "NORMAL" : "VISUAL"); }
        if (e.key === "1") setScreen("library");
        if (e.key === "2") setScreen("authors");
        if (e.key === "3") setScreen("topics");
        if (e.key === "4") setScreen("search");
        if (e.key === "5") setScreen("import");
        if (e.key === "6") setScreen("settings");
      };
      el.addEventListener("keydown", onKey);
      return () => el.removeEventListener("keydown", onKey);
    }, [mode, selectedIdx, items.length]);

    // Run :command
    const runCommand = (kind) => {
      if (kind === "cancel") { setMode("NORMAL"); setCommand(""); return; }
      const c = command.trim();
      if (mode === "SEARCH") {
        setSearchQuery(c);
        setScreen("search");
      } else if (mode === "COMMAND") {
        if (c.startsWith("view ")) { setView(c.slice(5)); setTweak("view", c.slice(5)); setScreen("library"); }
        else if (c.startsWith("theme ")) { setTweak("themeKey", c.slice(6)); }
        else if (c === "help" || c === "?") { setShowHelp(true); }
        else if (c === "q" || c === "quit") { /* no-op */ }
        else { setScreen(c); }
      }
      setMode("NORMAL"); setCommand("");
    };

    const onPalettePick = (it) => {
      if (it.screen) setScreen(it.screen);
      if (it.view)   { setView(it.view); setTweak("view", it.view); }
      if (it.theme)  setTweak("themeKey", it.theme);
      setPalette(false);
    };

    // Statusline content per screen
    const statusline = {
      left: screen === "library"
        ? `library/${view} · ${items.length} entries · sort:tweeted_at desc`
        : screen === "search"
        ? `/${searchQuery || "_"}`
        : `screen: ${screen}`,
      right: `${selectedIdx + 1}/${items.length}  ·  ${theme === C_THEMES.latte ? "latte" : t.themeKey}  ·  Ln ${selectedIdx + 1}  Col 1`,
    };

    // Body switch
    let body;
    if (screen === "library") {
      if (view === "table")     body = <CTableView theme={theme} font={font} density={t.density} items={items} selected={selectedIdx} multi={multi} accent={accent} onSelect={setSelectedIdx} />;
      else if (view === "tree") body = <CTreeView theme={theme} items={items} accent={accent} selected={selectedIdx} onSelect={setSelectedIdx} />;
      else if (view === "dashboard") body = <CDashboardView theme={theme} items={items} accent={accent} />;
      else if (view === "graph")     body = <CGraphView theme={theme} accent={accent} />;
      else if (view === "calendar")  body = <CCalendarView theme={theme} accent={accent} />;
    } else if (screen === "detail") {
      body = <CDetailScreen theme={theme} accent={accent} items={items} selectedIdx={selectedIdx} setSelectedIdx={setSelectedIdx} />;
    } else if (screen === "authors") {
      body = <CAuthorScreen theme={theme} accent={accent} handle="karpathy" />;
    } else if (screen === "topics") {
      body = <CTagScreen theme={theme} accent={accent} tag="rust" />;
    } else if (screen === "search") {
      body = <CSearchScreen theme={theme} accent={accent} query={searchQuery} setQuery={setSearchQuery} />;
    } else if (screen === "import") {
      body = <CImportScreen theme={theme} accent={accent} />;
    } else if (screen === "settings") {
      body = <CSettingsScreen
        theme={theme} accent={accent} font={font}
        fontKey={t.fontKey} setFontKey={(v) => setTweak("fontKey", v)}
        density={t.density} setDensity={(v) => setTweak("density", v)}
        themeKey={t.themeKey} setThemeKey={(v) => setTweak("themeKey", v)}
        weight={t.weight} setWeight={(v) => setTweak("weight", v)}
        accentKey={t.accentKey} setAccentKey={(v) => setTweak("accentKey", v)}
      />;
    } else if (screen === "onboarding") {
      body = <COnboardingScreen theme={theme} accent={accent} font={font} onBegin={() => setScreen("import")} />;
    }

    return (
      <>
        <DesignCanvas>
          <DCSection
            id="shell"
            title="Eterea C — Terminal Archive (full app)"
            subtitle="Single artboard you can interact with — switch screens via the topbar, j/k to move, ? for keybindings, Ctrl-P for palette, : for commands, / for search."
          >
            <DCArtboard id="full" label="Full app — click in, then keyboard nav" width={1440} height={900}>
              <div
                ref={rootRef}
                tabIndex={0}
                onClick={onTopBarClick}
                onFocus={() => {}}
                style={{ width: "100%", height: "100%", outline: "none", ...(weightStyle || {}) }}
              >
                <CShell
                  theme={theme} font={font}
                  mode={mode}
                  statusline={statusline}
                  command={command} setCommand={setCommand}
                  onCommand={runCommand}
                  currentScreen={screen}
                  multiSelect={multi.size}
                >
                  {body}
                </CShell>
                {palette && (
                  <CPalette
                    theme={theme}
                    query={paletteQ} setQuery={setPaletteQ}
                    items={PALETTE_ITEMS}
                    selected={paletteSel} setSelected={setPaletteSel}
                    onPick={onPalettePick}
                    onClose={() => setPalette(false)}
                  />
                )}
                {showHelp && <CKeybindings theme={theme} onClose={() => setShowHelp(false)} />}
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="screens"
            title="Screen gallery"
            subtitle="Each screen rendered standalone for review."
          >
            <DCArtboard id="library-table" label="Library · Table" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "library/table · 12 entries", right: "1/12" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="library" multiSelect={0}>
                  <CTableView theme={theme} font={font} density={t.density} items={items} selected={2} multi={new Set()} accent={accent} onSelect={() => {}} />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="library-tree" label="Library · Tree by author" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "library/tree", right: "" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="library" multiSelect={0}>
                  <CTreeView theme={theme} items={items} accent={accent} selected={1} onSelect={() => {}} />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="library-dash" label="Library · Dashboard" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "library/dashboard", right: "412 entries" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="library" multiSelect={0}>
                  <CDashboardView theme={theme} items={items} accent={accent} />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="library-graph" label="Library · Tag graph" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "library/graph", right: "10 nodes · 10 edges" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="library" multiSelect={0}>
                  <CGraphView theme={theme} accent={accent} />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="library-cal" label="Library · Calendar heatmap" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "library/calendar", right: "" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="library" multiSelect={0}>
                  <CCalendarView theme={theme} accent={accent} />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="screen-detail" label="Entry detail" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "detail · entry 003", right: "3/12" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="library" multiSelect={0}>
                  <CDetailScreen theme={theme} accent={accent} items={items} selectedIdx={2} setSelectedIdx={() => {}} />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="screen-author" label="Author archive · @karpathy" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "authors/@karpathy", right: "" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="authors" multiSelect={0}>
                  <CAuthorScreen theme={theme} accent={accent} handle="karpathy" />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="screen-tag" label="Topic page · #rust" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "topics/#rust", right: "" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="topics" multiSelect={0}>
                  <CTagScreen theme={theme} accent={accent} tag="rust" />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="screen-search" label="Search · /grep rust" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="SEARCH"
                  statusline={{ left: "/rust", right: "" }}
                  command="rust" setCommand={() => {}} onCommand={() => {}} currentScreen="search" multiSelect={0}>
                  <CSearchScreen theme={theme} accent={accent} query="rust" setQuery={() => {}} />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="screen-import" label="Import · X archive" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "import · 412 detected", right: "" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="import" multiSelect={0}>
                  <CImportScreen theme={theme} accent={accent} />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="screen-settings" label="Settings" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "settings", right: "" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="settings" multiSelect={0}>
                  <CSettingsScreen
                    theme={theme} accent={accent} font={font}
                    fontKey={t.fontKey} setFontKey={(v) => setTweak("fontKey", v)}
                    density={t.density} setDensity={(v) => setTweak("density", v)}
                    themeKey={t.themeKey} setThemeKey={(v) => setTweak("themeKey", v)}
                    weight={t.weight} setWeight={(v) => setTweak("weight", v)}
                    accentKey={t.accentKey} setAccentKey={(v) => setTweak("accentKey", v)}
                  />
                </CShell>
              </div>
            </DCArtboard>

            <DCArtboard id="screen-onboarding" label="Onboarding · first run" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "onboarding", right: "no db yet" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="library" multiSelect={0}>
                  <COnboardingScreen theme={theme} accent={accent} font={font} onBegin={() => {}} />
                </CShell>
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="overlays"
            title="Overlays"
            subtitle="Command palette + keybinding reference, captured against the live shell."
          >
            <DCArtboard id="overlay-palette" label="Command palette · Ctrl-P" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", position: "relative", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "command palette open", right: "" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="library" multiSelect={0}>
                  <CTableView theme={theme} font={font} density={t.density} items={items} selected={0} multi={new Set()} accent={accent} onSelect={() => {}} />
                </CShell>
                <CPalette
                  theme={theme}
                  query="vie" setQuery={() => {}}
                  items={PALETTE_ITEMS}
                  selected={0} setSelected={() => {}}
                  onPick={() => {}} onClose={() => {}}
                />
              </div>
            </DCArtboard>

            <DCArtboard id="overlay-keys" label="Keybindings · ?" width={1280} height={780}>
              <div style={{ width: "100%", height: "100%", position: "relative", ...(weightStyle || {}) }}>
                <CShell theme={theme} font={font} mode="NORMAL"
                  statusline={{ left: "library", right: "" }}
                  command="" setCommand={() => {}} onCommand={() => {}} currentScreen="library" multiSelect={0}>
                  <CTableView theme={theme} font={font} density={t.density} items={items} selected={0} multi={new Set()} accent={accent} onSelect={() => {}} />
                </CShell>
                <CKeybindings theme={theme} onClose={() => {}} />
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel>
          <TweakSection label="Focus screen (live shell)" />
          <TweakSelect
            label="Screen"
            value={t.focus}
            options={["library", "detail", "authors", "topics", "search", "import", "settings", "onboarding"]}
            onChange={(v) => setTweak("focus", v)}
          />
          <TweakSelect
            label="Library view"
            value={t.view}
            options={["table", "tree", "dashboard", "graph", "calendar"]}
            onChange={(v) => setTweak("view", v)}
          />

          <TweakSection label="Theme" />
          <TweakRadio
            label="Catppuccin"
            value={t.themeKey}
            options={["mocha", "macchiato", "latte"]}
            onChange={(v) => setTweak("themeKey", v)}
          />
          <TweakSelect
            label="Accent"
            value={t.accentKey}
            options={["pink", "blue", "green", "peach", "mauve", "yellow"]}
            onChange={(v) => setTweak("accentKey", v)}
          />

          <TweakSection label="Type" />
          <TweakSelect
            label="Mono font"
            value={t.fontKey}
            options={["jetbrains", "iosevka", "plex", "berkeley"]}
            onChange={(v) => setTweak("fontKey", v)}
          />
          <TweakRadio
            label="Weight"
            value={t.weight}
            options={["regular", "bold"]}
            onChange={(v) => setTweak("weight", v)}
          />
          <TweakRadio
            label="Density"
            value={t.density}
            options={["compact", "regular", "comfy"]}
            onChange={(v) => setTweak("density", v)}
          />
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
