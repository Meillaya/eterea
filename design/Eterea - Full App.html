<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Eterea — Full App</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500;1,8..60,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #f3ede1; }
</style>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#f3ede1"/>
    <text x="50" y="64" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#a8421f" font-weight="500">e</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="mock-data.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="b-system.jsx"></script>
<script type="text/babel" src="b-library.jsx"></script>
<script type="text/babel" src="b-screens.jsx"></script>
<script type="text/babel" src="b-shell.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "#a8421f",
    "paperTone": "cream",
    "density": "regular",
    "startScreen": "library"
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <>
        <BApp
          accent={t.accent}
          paperTone={t.paperTone}
          density={t.density}
          startScreen={t.startScreen}
          key={t.startScreen /* remount when jumped */}
        />

        <TweaksPanel>
          <TweakSection label="Jump to screen" />
          <TweakSelect
            label="Start at"
            value={t.startScreen}
            options={["onboarding", "library", "favorites", "authors", "topics", "search", "import", "settings"]}
            onChange={(v) => setTweak("startScreen", v)}
          />
          <TweakSection label="Paper" />
          <TweakRadio label="Tone" value={t.paperTone}
            options={["cream", "offwhite", "gray"]}
            onChange={(v) => setTweak("paperTone", v)} />
          <TweakColor label="Accent" value={t.accent} onChange={(v) => setTweak("accent", v)} />
          <TweakSection label="Reading" />
          <TweakRadio label="Density" value={t.density}
            options={["compact", "regular", "comfy"]}
            onChange={(v) => setTweak("density", v)} />
        </TweaksPanel>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
