<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Eterea — Editorial Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500;1,8..60,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #f0eee9; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#f3ede1"/>
    <text x="50" y="64" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#a8421f" font-weight="500">e</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="mock-data.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="b-system.jsx"></script>
<script type="text/babel" src="b-library.jsx"></script>
<script type="text/babel" src="b-screens.jsx"></script>
<script type="text/babel" src="b-app.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "#a8421f",
    "paperTone": "cream",
    "density": "regular"
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const W = 1280, H = 880;
    const paper = bPaper(t.paperTone);

    return (
      <>
        <DesignCanvas>
          <DCSection
            id="library"
            title="The Library — four layouts"
            subtitle="Same data, four reading modes. Click any entry to expand inline. j/k navigates, / searches."
          >
            <DCArtboard id="issue" label="01 · Issue" width={W} height={H}>
              <BLibraryApp accent={t.accent} paperTone={t.paperTone} density={t.density} />
            </DCArtboard>
            <DCArtboard id="front" label="02 · Front Page" width={W} height={H}>
              <BLibraryAppForced layout="front" accent={t.accent} paperTone={t.paperTone} density={t.density} />
            </DCArtboard>
            <DCArtboard id="long" label="03 · Long-Read" width={W} height={H}>
              <BLibraryAppForced layout="long" accent={t.accent} paperTone={t.paperTone} density={t.density} />
            </DCArtboard>
            <DCArtboard id="spread" label="04 · Two-up Spread" width={W} height={H}>
              <BLibraryAppForced layout="spread" accent={t.accent} paperTone={t.paperTone} density={t.density} />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="screens"
            title="Screens & flows"
            subtitle="The full app — entry detail, author/tag pages, search, import, settings, and first-run."
          >
            <DCArtboard id="onboard" label="05 · Onboarding" width={W} height={H}>
              <BScreenOnboarding paper={paper} accent={t.accent} />
            </DCArtboard>
            <DCArtboard id="detail" label="06 · Entry detail" width={W} height={H}>
              <BScreenDetail paper={paper} accent={t.accent} />
            </DCArtboard>
            <DCArtboard id="author" label="07 · Author archive" width={W} height={H}>
              <BScreenAuthor paper={paper} accent={t.accent} />
            </DCArtboard>
            <DCArtboard id="tag" label="08 · Topic page" width={W} height={H}>
              <BScreenTag paper={paper} accent={t.accent} />
            </DCArtboard>
            <DCArtboard id="search" label="09 · Search results" width={W} height={H}>
              <BScreenSearch paper={paper} accent={t.accent} />
            </DCArtboard>
            <DCArtboard id="import" label="10 · Import flow" width={W} height={H}>
              <BScreenImport paper={paper} accent={t.accent} />
            </DCArtboard>
            <DCArtboard id="settings" label="11 · Settings" width={W} height={H}>
              <BScreenSettings paper={paper} accent={t.accent} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel>
          <TweakSection label="Paper" />
          <TweakRadio
            label="Tone"
            value={t.paperTone}
            options={["cream", "offwhite", "gray"]}
            onChange={(v) => setTweak("paperTone", v)}
          />
          <TweakColor label="Accent" value={t.accent} onChange={(v) => setTweak("accent", v)} />
          <TweakSection label="Reading" />
          <TweakRadio
            label="Density"
            value={t.density}
            options={["compact", "regular", "comfy"]}
            onChange={(v) => setTweak("density", v)}
          />
        </TweaksPanel>
      </>
    );
  }

  // Forced-layout variant (the secondary artboards default to a fixed layout
  // but still let the user toggle via the tag rail if they want).
  function BLibraryAppForced({ layout, accent, paperTone, density }) {
    const [_layout, setLayout] = React.useState(layout);
    const [activeTag, setActiveTag] = React.useState(null);
    const [favOnly, setFavOnly] = React.useState(false);
    const [query, setQuery] = React.useState("");
    const [expanded, setExpanded] = React.useState(null);
    const [hovered, setHovered] = React.useState(null);
    const paper = bPaper(paperTone);
    const items = BOOKMARKS.filter(b => {
      if (favOnly && !b.is_favorite) return false;
      if (activeTag && !b.tags.includes(activeTag)) return false;
      return true;
    });
    const padding = density === "compact" ? "16px 36px 50px" : density === "comfy" ? "28px 36px 60px" : "20px 36px 50px";
    const title = favOnly ? "Favorites" : activeTag ? `On "${activeTag}"` : "The Library";
    const props = { items, paper, accent, expanded, setExpanded, hovered, setHovered, title };
    return (
      <div style={{
        width: "100%", height: "100%",
        background: paper.bg, color: paper.ink,
        fontFamily: B_FONT_SERIF,
        display: "flex", flexDirection: "column",
        overflow: "hidden", position: "relative",
      }}>
        <BMasthead paper={paper} />
        <BTagRail
          paper={paper} accent={accent}
          activeTag={activeTag} setActiveTag={setActiveTag}
          favOnly={favOnly} setFavOnly={setFavOnly}
          currentLayout={_layout} setCurrentLayout={setLayout}
          query={query} setQuery={setQuery}
        />
        <div style={{ overflow: "auto", flex: 1, padding, position: "relative" }}>
          {_layout === "issue"  && <BLayoutIssue {...props} />}
          {_layout === "front"  && <BLayoutFront {...props} />}
          {_layout === "long"   && <BLayoutLong {...props} />}
          {_layout === "spread" && <BLayoutSpread {...props} />}
        </div>
      </div>
    );
  }
  window.BLibraryAppForced = BLibraryAppForced;

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
